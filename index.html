</style></head><body><header><div class="bar"><a class="brand" href="#home"><i class="mark">ψ</i>量子力学</a><nav class="nav"><a href="#chapters">课程目录</a><a href="#labs">交互实验</a></nav></div></header><main id="app"></main><footer><div>量子力学　/　本科交互课程</div></footer>
<script>
const lessons=[
{title:'波函数与概率',intro:'从单粒子的位置测量，理解概率密度与归一化。',lab:'改变波包宽度',theory:'把处于同一状态的粒子逐个送入位置探测器，每次只记录一个落点。重复许多次后，落点的分布反映波函数模方。区间内曲线下的面积给出测得粒子在该区间内的概率。',formula:'P(a ≤ x ≤ b) = ∫ₐᵇ |ψ(x)|² dx',example:'设位置服从中心在零点的高斯分布，标准差为 σ。区间 [−σ, σ] 包含约 68.3% 的概率。增大 σ 时，峰变矮且分布变宽，总面积仍为 1。',control:'标准差 σ',min:0.4,max:1.5,step:.1,start:.8,unit:'',axis:'位置 x（任意长度单位）',ylabel:'概率密度',q:'归一化的高斯波包变宽后，整条概率密度曲线下的面积怎样变化？',opts:['增大','保持为 1','减小'],ans:1,why:'面积是粒子出现在全空间的总概率。改变宽度会改变峰高，但归一化要求总面积为 1。'},
{title:'无限深方势阱',intro:'用边界条件找出驻波，观察阱宽与能级的关系。',lab:'拉伸一维势阱',theory:'粒子被限制在 0 到 L 之间，阱内势能为零，两端波函数必须为零。能同时满足两端条件的正弦波，只能容纳整数个半波长，因此动量大小和能量只能取离散值。',formula:'ψₙ(x) = √(2/L) sin(nπx/L)　　Eₙ = n²π²ℏ²/(2mL²)',example:'同一粒子从基态进入第一激发态时，能量从 E₁ 变为 4E₁，阱内多出一个节点。下图固定 n = 2，改变 L，观察节点与能量。',control:'阱宽 L',min:1,max:4,step:.1,start:2,unit:'',axis:'位置 x（任意长度单位）',ylabel:'波函数 ψ₂',q:'固定量子数与质量，把阱宽增至原来的两倍，能量变为原来的多少？',opts:['二分之一','四倍','四分之一'],ans:2,why:'能量与 L 的平方成反比。阱变宽后允许的波长变长，动能随之降低。'},
{title:'叠加与时间演化',intro:'让两个能量本征态叠加，观察概率密度的振荡。',lab:'扫描相对相位',theory:'定态随时间积累整体相位，其位置概率密度不变。若把两个不同能量的定态等权叠加，二者积累相位的速度不同，位置概率密度中的干涉项便随时间变化。',formula:'ψ = (ψ₁ + e⁻ⁱᵠ ψ₂)/√2　　φ = (E₂ − E₁)t/ℏ',example:'取单位宽度势阱中的前两个实本征函数。当 φ 从 0 走到 π 时，干涉项变号，概率密度左右翻转。两次能量测量的统计分布仍相同，各能级的概率都是 1/2。',control:'相位 φ',min:0,max:360,step:5,start:0,unit:'°',axis:'相对位置 x/L',ylabel:'L |ψ|²',q:'相对相位从 0 变为 π，测得第二能级的概率是多少？',opts:['0','1/2','1'],ans:1,why:'第二个本征态的系数只有相位发生了变化，模方始终是 1/2。'},
{title:'量子隧穿',intro:'计算矩形势垒的透射率，观察宽度对隧穿的影响。',lab:'改变势垒厚度',theory:'能量低于势垒高度的粒子，在经典力学中无法越过势垒。量子波函数在有限势垒内部有衰减解。连接两侧的波函数及其导数，可以得到非零透射流。',formula:'T = [1 + V₀² sinh²(κa)/(4E(V₀ − E))]⁻¹',example:'设两侧势能均为零，固定入射能量 E = V₀/2。用 1/κ 作长度单位，其中 κ = √[2m(V₀ − E)]/ℏ，则透射率化为 T = 1/cosh²(κa)。图上圆点给出所选厚度的透射率。',control:'厚度 κa',min:0,max:4,step:.05,start:1,unit:'',axis:'无量纲厚度 κa',ylabel:'透射率 T',q:'在固定能量和势垒高度时，增加矩形势垒厚度会怎样？',opts:['透射率降低','透射率保持为 1','透射率增加'],ans:0,why:'厚势垒使两端波函数的耦合减弱。在此模型里 cosh(κa) 随厚度增加，T 随之降低。'},
{title:'自旋与测量',intro:'转动测量轴，预测自旋二分之一粒子的测量结果。',lab:'旋转自旋分析器',theory:'先沿 z 轴制备自旋向上的粒子，再沿与 z 轴成 θ 角的新轴测量。每次结果只有 +ℏ/2 或 −ℏ/2，测得正值的概率由初态与新轴正本征态的重叠决定。',formula:'P(+) = cos²(θ/2)　　P(−) = sin²(θ/2)',example:'当两根轴重合时，结果必为正。将测量轴转过 90°，两个结果各占一半。连续调整角度时，单次测量的可能取值固定，改变的是各结果的概率。',control:'夹角 θ',min:0,max:180,step:1,start:90,unit:'°',axis:'测量轴夹角 θ（°）',ylabel:'正值概率 P(+)',q:'初态沿 z 轴向上，沿负 z 方向测量，得到该方向正本征值的概率是多少？',opts:['1','1/2','0'],ans:2,why:'两根轴反向，θ = 180°，cos²(θ/2) = 0。初态正是新测量轴的负本征态。'},
{title:'氢原子轨道',intro:'区分空间概率密度与径向分布，寻找最概然半径。',lab:'探测基态电子的半径',theory:'氢原子基态具有球对称性。单位体积内的位置概率密度在原子核处最大，但离核越远，同样厚度的球壳体积越大。把密度乘以球壳体积因子后，径向分布的峰移到了有限半径。',formula:'u = r/a₀　　p(u) = 4u² exp(−2u)',example:'a₀ 为玻尔半径，p(u)du 表示在 u 到 u + du 的薄壳中找到电子的概率。令 p 的导数为零可得峰值 u = 1。首页画的是 2p 轨道，本实验考察球对称的 1s 态。',control:'半径 r/a₀',min:0,max:6,step:.05,start:1,unit:'',axis:'半径 r/a₀',ylabel:'径向概率密度',q:'氢原子 1s 态的径向概率密度在哪里最大？',opts:['r = 0','r = a₀','r = 2a₀'],ans:1,why:'在原点球壳体积因子为零。因子 u² 与指数衰减共同决定峰值位于 u = 1。'}];
const app=document.querySelector('#app'),pi=Math.PI;
const flash=['某一点的概率密度怎样变成可测的概率？','为什么势阱只允许特定能量？','为什么两个定态叠加后，密度会振荡？','κ 的倒数有什么物理意义？','自旋测量的平均值是多少？','为何 1s 态在核处密度最大，最概然半径却是 a₀？'];
const reverse=['对所考察的位置区间积分，即可得到落在其中的概率。','两端波函数为零要求 kL = nπ。允许的波数离散，动能也随之离散。','两个能量不同，相位积累速率不同，密度中的交叉项随相对相位变化。','它是势垒中衰减指数解的特征长度，经过该长度，衰减分量的振幅变为原来的 1/e。','用概率加权两个本征值，得到 (ℏ/2) cos θ。','径向分布还包含球壳面积因子 4πr²。它在核处为零，和指数衰减相乘后在 a₀ 处取峰值。'];
const id=n=>String(n+1).padStart(2,'0');
function home(){app.innerHTML='<section class="hero"><div><div class="kicker">QUANTUM MECHANICS</div><h1>量子力学</h1><p class="lead">从波函数到氢原子轨道，跟随六章讲义与交互实验，探索微观世界的运动规律。</p><div class="actions"><a class="btn primary" href="#lesson-1">开始学习　→</a><a class="btn" href="#labs">进入实验室</a></div></div><figure class="art"><canvas id="orb" width="960" height="585" aria-label="倾斜的氢原子 2p 轨道电子云，两叶相位相反"></canvas><figcaption>FIG. 01　氢原子 2p 轨道 · 概率云投影</figcaption></figure></section><section id="chapters"><div class="sectionhead"><div><small>SYLLABUS</small><h2>课程目录</h2></div><span>6 章 · 6 个交互实验</span></div><div class="cards">'+lessons.map((l,i)=>'<a class="card" href="#lesson-'+(i+1)+'"><span class="num">CHAPTER '+id(i)+'</span><canvas class="thumbnail" data-i="'+i+'" aria-hidden="true"></canvas><h3>'+l.title+'</h3><p>'+l.intro+'</p><div class="cardfoot">进入章节 <b>↗</b></div></a>').join('')+'</div></section><section id="labs"><div class="sectionhead"><div><small>LABORATORY</small><h2>交互实验室</h2></div></div><div id="lablist">'+lessons.map((l,i)=>'<a class="labrow" href="#lab-'+(i+1)+'"><small>'+id(i)+'</small><b>'+l.lab+'</b><span>→</span></a>').join('')+'</div></section>';orbital();document.querySelectorAll('.thumbnail').forEach(c=>plot(c,+c.dataset.i,lessons[c.dataset.i].start,true))}
function orbital(){const c=document.querySelector('#orb'),g=c.getContext('2d');let seed=131;function rand(){seed=(1664525*seed+1013904223)>>>0;return (seed+.5)/4294967296}
g.translate(480,283);g.strokeStyle='#e5e1dd';g.lineWidth=1;for(let x=-430;x<=430;x+=42){g.beginPath();g.moveTo(x,-240);g.lineTo(x,240);g.stroke()}for(let y=-210;y<=210;y+=42){g.beginPath();g.moveTo(-430,y);g.lineTo(430,y);g.stroke()}
g.rotate(-.47);g.strokeStyle='#b8acbe';g.setLineDash([7,8]);g.beginPath();g.moveTo(-410,0);g.lineTo(410,0);g.stroke();g.setLineDash([]);
// Sample r^4 exp(-r) and cos²(theta) for a hydrogenic 2p state.
for(let i=0;i<90000;i++){let r=0;for(let k=0;k<5;k++)r-=Math.log(rand());const u=Math.cbrt(2*rand()-1),x=32*r*u,y=32*r*Math.sqrt(1-u*u)*Math.cos(2*pi*rand());if(Math.abs(x)>395||Math.abs(y)>172)continue;g.fillStyle=u>0?'rgba(82,53,121,.34)':'rgba(67,110,106,.34)';g.fillRect(x,y,2.0,2.0)}g.rotate(.47);g.font='italic 25px Georgia';g.fillStyle='#766584';g.fillText('ψ > 0',280,-170);g.fillStyle='#597570';g.fillText('ψ < 0',-356,175)}
function curve(i,v,x){switch(i){case 0:return Math.exp(-x*x/(2*v*v))/(Math.sqrt(2*pi)*v);case 1:return x<=v?Math.sqrt(2/v)*Math.sin(2*pi*x/v):0;case 2:return Math.sin(pi*x)**2+Math.sin(2*pi*x)**2+2*Math.sin(pi*x)*Math.sin(2*pi*x)*Math.cos(v*pi/180);case 3:return 1/Math.cosh(x)**2;case 4:return Math.cos(pi*x/360)**2;case 5:return 4*x*x*Math.exp(-2*x)}}
function plot(c,i,v,mini){const w=c.clientWidth||320,h=mini?76:230,d=Math.min(2,window.devicePixelRatio||1);c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);const a=[-4,0,0,0,0,0][i],b=[4,4,1,4,180,6][i],lo=i===1?-1.5:0,hi=[1.05,1.5,3.3,1.05,1.05,.6][i],left=mini?5:46,right=w-(mini?5:16),top=mini?5:24,bottom=h-(mini?4:38),X=x=>left+(x-a)/(b-a)*(right-left),Y=y=>bottom-(y-lo)/(hi-lo)*(bottom-top);
g.strokeStyle='#e9e5e9';g.fillStyle='#605867';g.font='11px sans-serif';for(let j=0;j<=4;j++){const x=a+(b-a)*j/4;g.beginPath();g.moveTo(X(x),top);g.lineTo(X(x),bottom);g.stroke();if(!mini){g.textAlign='center';g.fillText(+x.toFixed(2),X(x),bottom+15)}}for(let j=0;j<=2;j++){const y=lo+(hi-lo)*j/2;g.beginPath();g.moveTo(left,Y(y));g.lineTo(right,Y(y));g.stroke();if(!mini){g.textAlign='right';g.fillText(+y.toFixed(2),left-5,Y(y)+4)}}
const color=['#796093','#4f7d76','#ab7253','#8b6783','#70876a','#7d7295'][i];g.beginPath();for(let j=0;j<=400;j++){const x=a+(b-a)*j/400;g[j?'lineTo':'moveTo'](X(x),Y(curve(i,v,x)))}g.strokeStyle=color;g.lineWidth=2.3;g.stroke();g.lineTo(right,Y(0));g.lineTo(left,Y(0));g.closePath();g.fillStyle=color+'20';g.fill();if(i>=3){g.beginPath();g.arc(X(v),Y(curve(i,v,v)),4,0,2*pi);g.fillStyle=color;g.fill()}if(!mini){g.fillStyle='#504653';g.textAlign='left';g.fillText(lessons[i].ylabel,left,13);g.textAlign='center';g.fillText(lessons[i].axis,(left+right)/2,h-3)}}
function lesson(i){const l=lessons[i];app.innerHTML='<article class="detail"><a class="back" href="#chapters">← 课程目录</a><p class="kicker">CHAPTER '+id(i)+'</p><h1>'+l.title+'</h1><p class="lead">'+l.intro+'</p><h2>课前预习</h2><p>'+l.theory+'</p><div class="formula">'+l.formula+'</div><p>'+l.example+'</p><section id="experiment"><h2>交互实验 · '+l.lab+'</h2><div class="panel"><div class="controls"><label>'+l.control+' <input type="range" min="'+l.min+'" max="'+l.max+'" step="'+l.step+'" value="'+l.start+'"><output></output></label></div><canvas class="plot" aria-label="'+l.ylabel+'随'+l.axis+'的变化曲线"></canvas><div class="feedback" id="reading"></div></div></section><h2>概念闪卡</h2><details class="panel"><summary>'+flash[i]+'　<span class="back">查看答案</span></summary><p>'+reverse[i]+'</p></details><h2>课后自测</h2><div class="panel"><p>'+l.q+'</p><div class="answers">'+l.opts.map((s,j)=>'<button data-j="'+j+'" aria-pressed="false">'+String.fromCharCode(65+j)+'　'+s+'</button>').join('')+'</div><p class="feedback" role="status" id="result"></p></div><div class="next"><button class="btn" id="save">下载本章讲义 ↓</button><a class="btn primary" href="'+(i<5?'#lesson-'+(i+2):'#chapters')+'">'+(i<5?'下一章 · '+lessons[i+1].title:'返回课程目录')+' →</a></div></article>';
const slider=app.querySelector('input'),c=app.querySelector('.plot');function refresh(){const v=+slider.value;app.querySelector('output').textContent=v+l.unit;plot(c,i,v,false);document.querySelector('#reading').textContent=['峰值密度 = '+curve(0,v,0).toFixed(3),'E₂ / E₂(L=1) = '+(1/v**2).toFixed(3),'左半阱概率 = '+(100*(.5+4*Math.cos(v*pi/180)/(3*pi))).toFixed(1)+'%','透射率 = '+(100*curve(3,v,v)).toFixed(2)+'%','测得 +ℏ/2 的概率 = '+(100*curve(4,v,v)).toFixed(1)+'%','当前径向概率密度 = '+curve(5,v,v).toFixed(3)][i]}slider.oninput=refresh;refresh();app.querySelectorAll('.answers button').forEach(btn=>btn.onclick=()=>{app.querySelectorAll('.answers button').forEach(el=>el.setAttribute('aria-pressed',el===btn));document.querySelector('#result').textContent=+btn.dataset.j===l.ans?'答对了。'+l.why:'再试一次。提示：'+l.why});document.querySelector('#save').onclick=()=>{const note=['量子力学 · 第 '+(i+1)+' 章　'+l.title,l.theory,l.formula,l.example,'概念复习　'+flash[i],reverse[i],'自测　'+l.q,'答案　'+l.opts[l.ans]+'。'+l.why].join('\n\n');const url=URL.createObjectURL(new Blob(['\ufeff'+note],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=l.title+'－讲义.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function route(){const hash=location.hash.slice(1),m=/^(lesson|lab)-([1-6])$/.exec(hash);if(m){lesson(+m[2]-1);document.title=lessons[+m[2]-1].title+' · 量子力学';if(m[1]==='lab')document.querySelector('#experiment').scrollIntoView();else scrollTo(0,0)}else{home();document.title='量子力学 · 交互课程';if(hash==='labs'||hash==='chapters')document.getElementById(hash).scrollIntoView();else scrollTo(0,0)}}window.onhashchange=route;route();
</script></body></html>
